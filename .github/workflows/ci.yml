name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-shims:
    name: No-shims gate
    uses: limnifs/.github/.github/workflows/no-shims-gate.yml@main

  spec:
    name: Spec lint
    uses: limnifs/.github/.github/workflows/spec-lint.yml@main
